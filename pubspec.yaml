name: bookmates
description: Social App für Bücherfreunde.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  http: ^1.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  image: ^4.12.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/OFL-SourceSerif4.txt
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf

# Branding: PNGs come from tool/branding/render_branding_test.dart.
# Regenerate: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7B3140"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F2E8"
  image: assets/branding/splash.png
  android_12:
    color: "#F7F2E8"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#7B3140"
  web: false
