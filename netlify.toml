# Website booksquad.de: static files from site/, no build step.
[build]
  publish = "site"
  command = ""
  # Skip the deploy (and its credits) unless the website itself changed.
  # Exit 0 = nothing relevant changed = skip. First deploy has no cached ref: build.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Inline script hash = the one-line `js` class toggle in index.html; recompute if it changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://thkfqvvzldkfxaqehjqn.supabase.co; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
